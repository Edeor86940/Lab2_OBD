services:
  postgres:
    image: postgres:18
    container_name: pg18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: demo
    ports: ["5433:5432"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d

  mysql:
    image: mysql:8.4
    container_name: mysql84
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: demo
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports: ["3307:3306"]
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d