services:
  db:
    image: mysql:8.4
    env_file: .env
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
  web:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["8080:80"]
    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src
volumes:
  db_data:
